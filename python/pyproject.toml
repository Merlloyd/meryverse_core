[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meryverse-core"
version = "0.1.0"
description = "Shared modules for MXH HTML dashboard generators"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["meryverse_core*"]
